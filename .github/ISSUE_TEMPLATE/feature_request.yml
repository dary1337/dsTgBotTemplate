name: Feature request
description: Suggest an addition or improvement
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What's the problem or use case?
          description: What are you trying to do that the template makes hard today?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: What would you like to see? A new example, a core change, docs?
    - type: dropdown
      id: kind
      attributes:
          label: Kind
          options:
              - New example
              - Core change
              - Documentation
              - Other
