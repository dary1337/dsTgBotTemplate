name: Release image

# Builds the bot image and pushes it to GitHub Container Registry (GHCR) under YOUR
# fork's namespace: ghcr.io/<your-user>/<your-repo>. No extra secrets — GITHUB_TOKEN is
# provided automatically. Make the resulting package public to pull it without login.
on:
    push:
        branches: [main]
        tags: ['v*']

jobs:
    image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=semver,pattern={{version}}
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
